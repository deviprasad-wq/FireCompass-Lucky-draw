<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireCompass — Lucky Draw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#140823;
    --canvas-2:#1c0f30;
    --panel:rgba(255,255,255,0.045);
    --panel-2:rgba(255,255,255,0.02);
    --border:rgba(150,110,255,0.20);
    --border-bright:rgba(0,229,255,0.35);
    --purple:#7B2BFF;
    --purple-deep:#4500B6;
    --cyan:#00E5FF;
    --cyan-soft:#5CF0FF;
    --magenta:#FF2E86;
    --white:#FFFFFF;
    --ink:#F5F1FF;
    --muted:#A99BC9;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 15% -10%, rgba(123,43,255,0.28) 0%, transparent 52%),
      radial-gradient(ellipse at 90% 8%, rgba(0,229,255,0.14) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 120%, rgba(255,46,134,0.10) 0%, transparent 55%),
      var(--canvas);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }

  .app{max-width:1200px;margin:0 auto; padding:26px 22px 60px;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:14px;
    border-bottom:1px solid var(--border);
    padding-bottom:20px; margin-bottom:30px;
  }
  .logo-mark{ display:flex; flex-direction:column; gap:6px; }
  .logo-img{ height:30px; width:auto; display:block; }
  .logo-text{ font-weight:900; font-size:22px; letter-spacing:-0.01em; color:var(--white); }
  .tagline{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--cyan); font-weight:600; }
  .kicker{ font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted); font-weight:600; }

  .mode-controls{display:flex; align-items:center; gap:12px;}
  .mode-btn{
    font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
    color:var(--cyan); background:transparent;
    border:1px solid var(--border-bright); padding:10px 16px; border-radius:8px;
    cursor:pointer; transition:border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .mode-btn:hover{border-color:var(--cyan); background:rgba(0,229,255,0.08); box-shadow:0 0 18px rgba(0,229,255,0.18);}
  .mode-btn:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  .icon-btn{ padding:10px 13px; font-size:14px; line-height:1; }

  .layout{ display:grid; grid-template-columns:290px 1fr 260px; gap:22px; align-items:start; }
  @media (max-width:980px){ .layout{grid-template-columns:1fr;} }

  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--border);
    border-radius:16px; padding:20px;
    backdrop-filter:blur(6px);
    box-shadow:0 1px 0 rgba(255,255,255,0.06) inset;
  }
  .panel h2{ font-size:12px; letter-spacing:0.12em; text-transform:uppercase; font-weight:700; color:var(--cyan); margin:0 0 13px; }

  body.present-mode .setup-only{ display:none !important; }
  body.present-mode .layout{ grid-template-columns:1fr; }
  body.present-mode .stage-panel{ padding:56px 20px 48px; }
  body.present-mode .tagline{ display:none; }

  textarea{
    width:100%; min-height:100px; resize:vertical;
    background:rgba(0,0,0,0.3); border:1px solid var(--border);
    border-radius:10px; color:var(--ink);
    font-family:'Inter',sans-serif; font-size:13.5px; padding:10px 12px; line-height:1.5;
  }
  textarea:focus{outline:2px solid var(--cyan); outline-offset:1px;}
  textarea::placeholder{color:var(--muted); opacity:0.8;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:6px;}

  button{font-family:inherit; cursor:pointer; border:none;}
  .btn-secondary{
    width:100%; margin-top:10px; padding:10px 12px;
    background:transparent; border:1px solid var(--border-bright);
    color:var(--cyan); border-radius:10px; font-size:13px; font-weight:600;
    transition:background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-secondary:hover{background:rgba(0,229,255,0.08); border-color:var(--cyan); box-shadow:0 0 16px rgba(0,229,255,0.15);}
  .btn-secondary:focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}

  .divider{height:1px; background:var(--border); margin:16px 0; border:none;}

  .chips{ display:flex; flex-wrap:wrap; gap:6px; max-height:170px; overflow-y:auto; margin-top:10px; padding-right:2px; }
  .chip{
    font-size:12px; background:rgba(0,0,0,0.32); border:1px solid var(--border);
    color:var(--ink); padding:5px 10px; border-radius:100px;
    display:flex; align-items:center; gap:6px;
  }
  .chip button{background:none; color:var(--muted); font-size:13px; padding:0;}
  .chip button:hover{color:var(--magenta);}
  .empty-note{font-size:12.5px; color:var(--muted); font-style:italic;}

  .toggle-row{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink); margin-bottom:12px; cursor:pointer; }
  .toggle-row input{accent-color:var(--purple); width:15px; height:15px; cursor:pointer;}

  .ticket-count{text-align:right;}
  .ticket-count .num{ font-size:30px; font-weight:800; color:var(--cyan); line-height:1; font-variant-numeric:tabular-nums; }
  .ticket-count .label{ font-size:10.5px; letter-spacing:0.16em; color:var(--muted); text-transform:uppercase; margin-top:4px; font-weight:600; }

  .stage-panel{ display:flex; flex-direction:column; align-items:center; padding:36px 20px 34px; }
  .reticle-wrap{
    position:relative; width:min(380px, 84vw); height:min(380px, 84vw);
    filter:drop-shadow(0 0 40px rgba(0,229,255,0.12));
  }
  .reticle-svg{ width:100%; height:100%; display:block; }
  .ring-outer{ fill:none; stroke:url(#ringGrad); stroke-width:1.4; }
  .ring-inner{ fill:none; stroke:var(--border); stroke-width:1; opacity:0.6; }
  .ring-ticks line{ stroke:var(--muted); stroke-width:1; opacity:0.5; }
  .sweep{ transform-origin:190px 190px; animation:none; }
  .sweep.spinning{ animation:sweep-rotate 1.05s linear infinite; }
  .sweep.fast{ animation-duration:0.4s; }
  @keyframes sweep-rotate{ to{ transform:rotate(360deg); } }

  .crosshair line{ stroke:var(--cyan); stroke-width:2; transition:stroke 0.35s ease; }
  .reticle-wrap.building .crosshair line,
  .reticle-wrap.locked .crosshair line{ stroke:var(--magenta); }
  .reticle-wrap.building .ring-outer,
  .reticle-wrap.locked .ring-outer{ stroke:var(--magenta); transition:stroke 0.35s ease; }

  .corner{
    position:absolute; width:24px; height:24px; border-color:var(--cyan);
    transition:border-color 0.35s ease, transform 0.4s cubic-bezier(0.2,0.8,0.3,1.2);
  }
  .reticle-wrap.building .corner,
  .reticle-wrap.locked .corner{ border-color:var(--magenta); }
  .corner.tl{ top:4px; left:4px; border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:4px; right:4px; border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:4px; left:4px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:4px; right:4px; border-bottom:2px solid; border-right:2px solid; }
  .reticle-wrap.locked .corner.tl{ transform:translate(-4px,-4px); }
  .reticle-wrap.locked .corner.tr{ transform:translate(4px,-4px); }
  .reticle-wrap.locked .corner.bl{ transform:translate(-4px,4px); }
  .reticle-wrap.locked .corner.br{ transform:translate(4px,4px); }

  /* build-up heartbeat pulse */
  .reticle-wrap.building{ animation:buildPulse 0.5s ease-in-out infinite; }
  @keyframes buildPulse{
    0%,100%{ transform:scale(1);   filter:drop-shadow(0 0 40px rgba(0,229,255,0.2)); }
    50%    { transform:scale(1.04); filter:drop-shadow(0 0 80px rgba(255,46,134,0.55)); }
  }

  .name-slot{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 30px;
  }
  .name-slot .who{
    font-weight:800; font-size:clamp(17px,3.4vw,27px); color:var(--ink);
    line-height:1.2; word-break:break-word;
    transition:transform 0.3s ease, color 0.3s ease, opacity 0.3s ease, font-size 0.3s ease;
  }
  .reticle-wrap.scanning .name-slot .who{ font-size:15px; opacity:0.45; margin-bottom:8px; }
  .reticle-wrap.building .name-slot .who{ font-size:clamp(20px,4vw,32px); opacity:0.9; color:var(--cyan-soft); }
  .reticle-wrap.locked .name-slot .who{ color:var(--white); text-shadow:0 0 30px rgba(255,46,134,0.6); animation:revealPop 0.55s cubic-bezier(0.2,1.1,0.3,1.15) both; }
  @keyframes revealPop{
    0%{ transform:scale(0.4); opacity:0; }
    55%{ transform:scale(1.22); opacity:1; }
    100%{ transform:scale(1.14); }
  }

  .countdown{
    display:none;
    font-variant-numeric:tabular-nums; font-weight:900;
    font-size:clamp(80px,20vw,150px); line-height:0.9;
    color:var(--cyan); text-shadow:0 0 44px rgba(0,229,255,0.55);
  }
  .reticle-wrap.scanning .countdown{ display:block; }
  .countdown.pop{ animation:countPop 0.92s cubic-bezier(0.2,0.8,0.3,1) both; }
  .countdown.final{ color:var(--magenta); text-shadow:0 0 50px rgba(255,46,134,0.6); }
  @keyframes countPop{
    0%{ opacity:0; transform:scale(2.1); filter:blur(6px); }
    16%{ opacity:1; transform:scale(1); filter:blur(0); }
    72%{ opacity:1; transform:scale(1); }
    100%{ opacity:0; transform:scale(0.55); filter:blur(3px); }
  }

  .status-label{
    margin-top:24px; font-size:12px; letter-spacing:0.2em; text-transform:uppercase;
    font-weight:600; color:var(--muted); min-height:16px; text-align:center;
  }
  .status-label.locked{ color:var(--magenta); }
  .status-label.scanning{ color:var(--cyan); }
  .status-label.building{ color:var(--magenta); animation:statusFlash 0.5s ease-in-out infinite; }
  @keyframes statusFlash{ 0%,100%{opacity:0.55;} 50%{opacity:1;} }

  .draw-btn{
    margin-top:24px; font-weight:800; font-size:17px; letter-spacing:0.03em; color:var(--white);
    background:linear-gradient(135deg, var(--purple) 0%, var(--purple-deep) 60%, #2E0080 100%);
    padding:15px 54px; border-radius:100px;
    box-shadow:0 8px 30px rgba(123,43,255,0.45), 0 0 0 1px rgba(0,229,255,0.15) inset, 0 1px 0 rgba(255,255,255,0.25) inset;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .draw-btn:hover:not(:disabled){ transform:translateY(-2px); box-shadow:0 14px 36px rgba(123,43,255,0.55), 0 0 24px rgba(0,229,255,0.25); }
  .draw-btn:active:not(:disabled){ transform:translateY(0) scale(0.98); }
  .draw-btn:disabled{ opacity:0.32; cursor:not-allowed; box-shadow:none; }
  .draw-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }

  #historyList{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; max-height:420px; overflow-y:auto; }
  #historyList li{
    display:flex; align-items:baseline; gap:10px;
    background:rgba(0,0,0,0.28); border:1px solid var(--border);
    border-radius:10px; padding:9px 12px; font-size:13px;
  }
  #historyList .order{ color:var(--cyan); font-size:12px; font-weight:700; flex-shrink:0; font-variant-numeric:tabular-nums; }
  #historyList .win-name{ color:var(--ink); font-weight:600; overflow-wrap:anywhere; }
  .history-empty{ font-size:12.5px; color:var(--muted); font-style:italic; }

  .winner-overlay{
    position:fixed; inset:0; background:rgba(9,4,20,0.9);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
    backdrop-filter:blur(4px);
  }
  .winner-overlay.show{ display:flex; }
  .winner-card{
    background:linear-gradient(180deg, var(--canvas-2), #120722);
    border:1px solid var(--magenta);
    border-radius:20px; padding:46px 40px; text-align:center; max-width:460px; width:100%;
    box-shadow:0 24px 80px rgba(0,0,0,0.65), 0 0 60px rgba(255,46,134,0.25);
    animation:pop 0.4s cubic-bezier(0.2,0.8,0.3,1.2);
  }
  @keyframes pop{ from{ transform:scale(0.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .winner-card .eyebrow{ font-size:11px; letter-spacing:0.28em; font-weight:700; color:var(--magenta); text-transform:uppercase; }
  .winner-card .name{ font-weight:900; font-size:clamp(28px,6vw,40px); color:var(--white); margin:14px 0 4px; word-break:break-word; }
  .winner-card .sub{ color:var(--muted); font-size:13px; margin-bottom:26px; font-weight:600; letter-spacing:0.04em; }
  .winner-card button{ font-weight:700; font-size:14px; color:var(--canvas); background:var(--cyan); padding:12px 32px; border-radius:100px; transition:background 0.15s ease; }
  .winner-card button:hover{ background:var(--white); }

  .confetti-piece{ position:fixed; top:-20px; width:9px; height:14px; border-radius:2px; pointer-events:none; z-index:60; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(105vh) rotate(540deg); opacity:0.9; } }

  /* reveal flash */
  .flash{ position:fixed; inset:0; background:var(--white); opacity:0; pointer-events:none; z-index:70; }
  .flash.go{ animation:flashBurst 0.45s ease-out forwards; }
  @keyframes flashBurst{ 0%{opacity:0;} 12%{opacity:0.85;} 100%{opacity:0;} }

  @media (prefers-reduced-motion: reduce){
    .sweep.spinning{ animation:none; }
    .confetti-piece, .flash.go{ display:none; }
    .winner-card, .reticle-wrap.building, .status-label.building{ animation:none; }
    .countdown.pop, .reticle-wrap.locked .name-slot .who{ animation:none; opacity:1; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo-mark">
      <img class="logo-img" id="logoImg" src="https://firecompass.com/wp-content/uploads/2024/07/logo-1.png" alt="FireCompass">
      <div class="logo-text" id="logoFallback" style="display:none;">FireCompass</div>
      <div class="tagline">Hack Yourself Before AI Does</div>
    </div>
    <div class="mode-controls setup-only">
      <button class="mode-btn icon-btn sound-btn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <div class="ticket-count">
        <div class="num" id="poolCount">0</div>
        <div class="label">in pool</div>
      </div>
      <button class="mode-btn" id="presentBtn">Presenter mode</button>
    </div>
    <div class="mode-controls present-only" style="display:none;">
      <span class="kicker">Lucky Draw</span>
      <button class="mode-btn icon-btn sound-btn" title="Toggle sound" aria-label="Toggle sound">🔊</button>
      <button class="mode-btn" id="exitPresentBtn">Exit presenter mode</button>
    </div>
  </header>

  <div class="layout">

    <section class="panel setup-only">
      <h2>Participants</h2>
      <textarea id="nameInput" placeholder="Type or paste names, one per line&#10;e.g.&#10;Asha Rao&#10;Vikram Shetty&#10;Priya Nair"></textarea>
      <div class="hint">One name per line. Duplicates are ignored.</div>
      <button class="btn-secondary" id="addBtn">Add to pool</button>

      <hr class="divider">
      <div class="toggle-row">
        <input type="checkbox" id="removeToggle" checked>
        <label for="removeToggle">Remove winner from pool after each draw</label>
      </div>
      <button class="btn-secondary" id="clearBtn">Clear entire pool</button>

      <hr class="divider">
      <h2>Current pool</h2>
      <div class="empty-note" id="emptyNote">No participants yet — add some names above.</div>
      <div class="chips" id="chips"></div>
    </section>

    <section class="panel stage-panel">
      <div class="reticle-wrap" id="reticleWrap">
        <svg class="reticle-svg" viewBox="0 0 380 380">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00E5FF"/>
              <stop offset="100%" stop-color="#7B2BFF"/>
            </linearGradient>
            <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.45"/>
              <stop offset="100%" stop-color="#7B2BFF" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <circle class="ring-outer" cx="190" cy="190" r="160"></circle>
          <circle class="ring-inner" cx="190" cy="190" r="132"></circle>
          <g class="ring-ticks">
            <line x1="190" y1="18" x2="190" y2="36"></line>
            <line x1="190" y1="344" x2="190" y2="362"></line>
            <line x1="18" y1="190" x2="36" y2="190"></line>
            <line x1="344" y1="190" x2="362" y2="190"></line>
          </g>
          <g class="sweep" id="sweep">
            <path d="M190 190 L190 30 A160 160 0 0 1 268 63 Z" fill="url(#sweepGrad)"></path>
          </g>
          <g class="crosshair">
            <line x1="190" y1="74" x2="190" y2="112"></line>
            <line x1="190" y1="268" x2="190" y2="306"></line>
            <line x1="74" y1="190" x2="112" y2="190"></line>
            <line x1="268" y1="190" x2="306" y2="190"></line>
          </g>
        </svg>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="name-slot">
          <span class="who" id="nameSlot">—</span>
          <div class="countdown" id="countdown">20</div>
        </div>
      </div>
      <div class="status-label" id="statusLabel">Add participants to begin</div>
      <button class="draw-btn" id="drawBtn" disabled>Draw</button>
    </section>

    <section class="panel setup-only">
      <h2>Winners</h2>
      <ol id="historyList"></ol>
      <div class="history-empty" id="historyEmpty">No draws yet.</div>
    </section>

  </div>
</div>

<div class="flash" id="flash"></div>

<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-card">
    <div class="eyebrow">Target identified</div>
    <div class="name" id="winnerName">—</div>
    <div class="sub" id="winnerSub"></div>
    <button id="closeWinner">Continue</button>
  </div>
</div>

<script>
(function(){
  const state = { pool: [], winners: [] };

  const START_COUNT   = 20;                  // counts 20, 19 ... 1
  const DRAW_DURATION = START_COUNT * 1000;  // 20 second scan
  const BUILD_DURATION= 3200;                // dramatic lock-up before reveal

  const nameInput   = document.getElementById('nameInput');
  const addBtn      = document.getElementById('addBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const chips       = document.getElementById('chips');
  const emptyNote   = document.getElementById('emptyNote');
  const poolCount   = document.getElementById('poolCount');
  const drawBtn     = document.getElementById('drawBtn');
  const statusLabel = document.getElementById('statusLabel');
  const nameSlot    = document.getElementById('nameSlot');
  const countdown   = document.getElementById('countdown');
  const sweep       = document.getElementById('sweep');
  const reticleWrap = document.getElementById('reticleWrap');
  const historyList = document.getElementById('historyList');
  const historyEmpty= document.getElementById('historyEmpty');
  const removeToggle= document.getElementById('removeToggle');
  const winnerOverlay = document.getElementById('winnerOverlay');
  const winnerName  = document.getElementById('winnerName');
  const winnerSub   = document.getElementById('winnerSub');
  const closeWinner = document.getElementById('closeWinner');
  const presentBtn  = document.getElementById('presentBtn');
  const exitPresentBtn = document.getElementById('exitPresentBtn');
  const logoImg     = document.getElementById('logoImg');
  const logoFallback= document.getElementById('logoFallback');
  const flash       = document.getElementById('flash');
  const soundBtns   = document.querySelectorAll('.sound-btn');

  logoImg.addEventListener('error', () => {
    logoImg.style.display = 'none';
    logoFallback.style.display = 'block';
  });

  /* ---------- Audio ---------- */
  let audioCtx = null, soundOn = true;
  function ensureAudio(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function blip(freq, dur, type, gain){
    if(!soundOn || !audioCtx) return;
    try{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(gain || 0.14, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.09));
      o.start(t); o.stop(t + (dur || 0.09) + 0.02);
    }catch(e){}
  }
  let buildOsc = null;
  function startBuildTone(){
    if(!soundOn || !audioCtx) return;
    try{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
      o.type = 'sawtooth'; f.type = 'lowpass'; f.frequency.value = 1400;
      const t = audioCtx.currentTime, end = t + BUILD_DURATION/1000;
      o.frequency.setValueAtTime(200, t);
      o.frequency.exponentialRampToValueAtTime(900, end);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.4);
      g.gain.setValueAtTime(0.09, end - 0.25);
      g.gain.exponentialRampToValueAtTime(0.0001, end);
      o.connect(f); f.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(end + 0.05);
      buildOsc = o;
    }catch(e){}
  }
  function impact(){
    if(!soundOn || !audioCtx) return;
    [523, 659, 784, 1047].forEach(fr => blip(fr, 0.7, 'triangle', 0.11));
  }
  soundBtns.forEach(btn => btn.addEventListener('click', () => {
    soundOn = !soundOn;
    if(soundOn) ensureAudio();
    soundBtns.forEach(b => b.textContent = soundOn ? '🔊' : '🔇');
  }));

  let spinning = false;
  let countInterval = null;

  function renderPool(){
    chips.innerHTML = '';
    emptyNote.style.display = state.pool.length === 0 ? 'block' : 'none';
    state.pool.forEach((name, idx) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `<span></span><button aria-label="Remove ${escapeHtml(name)}">✕</button>`;
      chip.querySelector('span').textContent = name;
      chip.querySelector('button').addEventListener('click', () => {
        state.pool.splice(idx,1);
        renderPool();
      });
      chips.appendChild(chip);
    });
    poolCount.textContent = state.pool.length;
    drawBtn.disabled = state.pool.length === 0 || spinning;
    if(!spinning){
      statusLabel.textContent = state.pool.length === 0
        ? 'Add participants to begin'
        : `${state.pool.length} ticket${state.pool.length===1?'':'s'} loaded — ready to draw`;
      statusLabel.classList.remove('locked','scanning','building');
      nameSlot.textContent = '—';
      reticleWrap.classList.remove('locked','scanning','building');
    }
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function randomName(){
    let n = state.pool[Math.floor(Math.random() * state.pool.length)];
    if(state.pool.length > 1){
      let guard = 0;
      while(n === nameSlot.textContent && guard < 5){
        n = state.pool[Math.floor(Math.random() * state.pool.length)];
        guard++;
      }
    }
    return n;
  }

  addBtn.addEventListener('click', () => {
    const lines = nameInput.value.split('\n').map(s => s.trim()).filter(Boolean);
    lines.forEach(name => { if(!state.pool.includes(name)) state.pool.push(name); });
    nameInput.value = '';
    renderPool();
  });

  clearBtn.addEventListener('click', () => {
    if(spinning) return;
    state.pool = [];
    renderPool();
  });

  presentBtn.addEventListener('click', () => {
    document.body.classList.add('present-mode');
    document.querySelector('.mode-controls.present-only').style.display = 'flex';
    document.querySelector('.mode-controls.setup-only').style.display = 'none';
  });
  exitPresentBtn.addEventListener('click', () => {
    document.body.classList.remove('present-mode');
    document.querySelector('.mode-controls.present-only').style.display = 'none';
    document.querySelector('.mode-controls.setup-only').style.display = 'flex';
  });

  function showNumber(n){
    countdown.textContent = n;
    countdown.classList.toggle('final', n <= 5);
    countdown.classList.remove('pop');
    void countdown.offsetWidth;
    countdown.classList.add('pop');
    // rising-pitch blip on each tick, sharper in the final 5
    blip(300 + (START_COUNT - n) * 22, 0.08, n <= 5 ? 'square' : 'sine', n <= 5 ? 0.16 : 0.1);
  }

  drawBtn.addEventListener('click', () => {
    if(spinning || state.pool.length === 0) return;
    ensureAudio();
    spinning = true;
    drawBtn.disabled = true;
    statusLabel.textContent = 'Scanning targets';
    statusLabel.className = 'status-label scanning';
    reticleWrap.classList.remove('locked','building');
    reticleWrap.classList.add('scanning');
    sweep.classList.add('spinning');

    const winnerIdx = Math.floor(Math.random() * state.pool.length);
    const winner = state.pool[winnerIdx];
    const startTime = performance.now();

    // whole-number countdown 20..1, one per second
    let current = START_COUNT;
    showNumber(current);
    countInterval = setInterval(() => {
      current -= 1;
      if(current >= 1){ showNumber(current); }
      else { clearInterval(countInterval); countInterval = null; }
    }, 1000);

    // name shuffle: fast early, slows toward the end
    const minDelay = 45, maxDelay = 620;
    function tick(){
      const elapsed = performance.now() - startTime;
      const progress = Math.min(elapsed / DRAW_DURATION, 1);
      if(progress >= 1){ buildToReveal(winner, winnerIdx); return; }
      const delay = minDelay + Math.pow(progress, 3) * (maxDelay - minDelay);
      nameSlot.textContent = randomName();
      setTimeout(tick, delay);
    }
    tick();
  });

  // Suspense phase: countdown is done, hold the room, then reveal.
  function buildToReveal(winner, winnerIdx){
    if(countInterval){ clearInterval(countInterval); countInterval = null; }
    reticleWrap.classList.remove('scanning');
    reticleWrap.classList.add('building');
    statusLabel.textContent = 'Locking target';
    statusLabel.className = 'status-label building';
    sweep.classList.add('fast');
    startBuildTone();

    setTimeout(() => { if(spinning) statusLabel.textContent = 'And the winner is'; }, BUILD_DURATION - 950);

    const bStart = performance.now();
    const bMin = 260, bMax = 900; // slows into a drumroll
    function bTick(){
      const p = Math.min((performance.now() - bStart) / BUILD_DURATION, 1);
      if(p >= 1){ reveal(winner, winnerIdx); return; }
      nameSlot.textContent = randomName();
      blip(520, 0.05, 'sine', 0.05); // soft drumroll ticks
      const delay = bMin + p * (bMax - bMin);
      setTimeout(bTick, delay);
    }
    bTick();
  }

  function reveal(winner, winnerIdx){
    sweep.classList.remove('spinning','fast');
    reticleWrap.classList.remove('building');
    reticleWrap.classList.add('locked');

    // flash + impact + name snap
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    impact();
    nameSlot.textContent = winner;

    statusLabel.textContent = 'Target identified';
    statusLabel.className = 'status-label locked';

    state.winners.push(winner);
    if(removeToggle.checked){ state.pool.splice(winnerIdx,1); }
    renderHistory();
    launchConfetti();

    winnerName.textContent = winner;
    winnerSub.textContent = `Draw #${state.winners.length}`;
    // let the reticle reveal land first, then bring up the card
    setTimeout(() => winnerOverlay.classList.add('show'), 750);
  }

  function renderHistory(){
    historyList.innerHTML = '';
    historyEmpty.style.display = state.winners.length === 0 ? 'block' : 'none';
    state.winners.slice().reverse().forEach((name, i) => {
      const order = state.winners.length - i;
      const li = document.createElement('li');
      li.innerHTML = `<span class="order">#${order}</span><span class="win-name"></span>`;
      li.querySelector('.win-name').textContent = name;
      historyList.appendChild(li);
    });
  }

  closeWinner.addEventListener('click', () => {
    winnerOverlay.classList.remove('show');
    spinning = false;
    renderPool();
  });

  function launchConfetti(){
    const colors = ['#7B2BFF','#4500B6','#00E5FF','#FF2E86','#FFFFFF'];
    for(let i=0;i<70;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = Math.random()*100 + 'vw';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (2.2 + Math.random()*1.6) + 's';
      piece.style.animationDelay = (Math.random()*0.4) + 's';
      document.body.appendChild(piece);
      setTimeout(() => piece.remove(), 4200);
    }
  }

  renderPool();
  renderHistory();
})();
</script>
